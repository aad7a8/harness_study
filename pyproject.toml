[project]
name = "harness-study"
version = "0.1.0"
description = "Chat client for a local OpenAI-compatible LLM server"
readme = "README.md"
authors = [
    { name = "aad7a8", email = "aad7a8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
harness-study = "harness_study:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

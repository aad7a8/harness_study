[project]
name = "harness-study"
version = "0.1.0"
description = "From a single API call to a self-built agent harness"
readme = "README.md"
authors = [
    { name = "aad7a8", email = "aad7a8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
agent = "agent.s00_api_call:main"

[tool.uv.build-backend]
module-name = "agent"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
